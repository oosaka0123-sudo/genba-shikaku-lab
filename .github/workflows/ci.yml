name: Site CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          set -euo pipefail
          for f in index.html diagnosis.html about.html privacy.html contact.html styles.css app.js robots.txt sitemap.xml favicon.svg; do
            test -s "$f" || { echo "Missing: $f"; exit 1; }
          done
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check postprocess.mjs
          node --check enrich.mjs
          node --check build.mjs
      - name: Check core links and policy
        run: |
          set -euo pipefail
          grep -q '30秒 現場資格診断' diagnosis.html
          grep -q 'genba@rss7.net' contact.html
          grep -q 'https://genba.rss7.net/sitemap.xml' robots.txt
          test "$(find qualifications -maxdepth 1 -name '*.html' | wc -l)" -eq 8
      - name: Check encoding and qualification template
        run: |
          set -euo pipefail
          ! grep -R -E '縺|繝|莠|蜿|鬨|蝣|�|Ã|Â' --include='*.html' --include='*.js' .
          ! grep -R -E 'nav-toggle|site-nav|header-inner' qualifications
          for f in qualifications/*.html; do
            grep -q 'class="menu-btn"' "$f"
            grep -q 'class="nav"' "$f"
          done
          ! grep -R -E '(href|src)="/[^/]' --include='*.html' .
          ! grep -R 'href="/#qualifications"' --include='*.html' .
      - name: Check deprecated builder guard
        run: grep -q 'intentionally disabled' build.mjs
